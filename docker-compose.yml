services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # A fresh volume runs these in name order: the seed, then schema v3 on top.
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/prisma/local/before-schema-v3.sql:/docker-entrypoint-initdb.d/02-before-schema-v3.sql
      - ./backend/prisma/migrations/20261011000000_schema_v3_transaction_split/migration.sql:/docker-entrypoint-initdb.d/03-schema-v3.sql

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pgdata:
  redis_data: